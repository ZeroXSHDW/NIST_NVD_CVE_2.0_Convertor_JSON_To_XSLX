name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nist-converter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Verify dependency consistency
        run: |
          python -m pip check
          python -m pip_audit --progress-spinner off
      - name: Syntax check
        run: python -m py_compile download_nvd.py json_to_xlsx.py validate_xlsx.py run_pipeline.py
      - name: Unit tests
        run: python -m pytest tests/ -q
